# Local Postgres for development and the integration tests.
#
#   docker compose up -d db
#   TEST_DATABASE_URL=postgres://vaultify:vaultify@localhost:5432/vaultify npm test
#
# If port 5432 is already taken by a local Postgres install, pick another:
#   VAULTIFY_DB_PORT=55432 docker compose up -d db
#
# Development credentials only. Production runs a managed database with real
# secrets injected by the platform.

services:
  db:
    image: postgres:17-alpine
    container_name: vaultify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultify
      POSTGRES_PASSWORD: vaultify
      POSTGRES_DB: vaultify
    ports:
      # Host port is configurable: a machine with Postgres already installed
      # will silently win the bind on 5432, and connections then hit the wrong
      # server with a confusing "password authentication failed".
      #   VAULTIFY_DB_PORT=55432 docker compose up -d db
      - "${VAULTIFY_DB_PORT:-5432}:5432"
    volumes:
      - vaultify-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultify -d vaultify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultify-pgdata:
